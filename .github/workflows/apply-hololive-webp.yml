name: Apply HOLOLIVE named WebP images

on:
  pull_request:
    branches:
      - update/renaming-images-2026

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout HOLOLIVE image folder
        uses: actions/checkout@v4
        with:
          ref: agent/apply-hololive-webp-20260801
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows
            img/HOLOLIVE
          sparse-checkout-cone-mode: true

      - name: Apply and validate WebP package
        shell: bash
        env:
          PACKAGE_URL: "https://sdmntprukwest.oaiusercontent.com/files/00000000-0270-8243-8cc6-dfb086dde694/raw?se=2026-08-01T14:45:22Z&sp=r&sv=2026-02-06&sr=b&scid=5cadfbbd-46c7-55e7-b7a1-823770b963d5&skoid=061609b8-1cdb-4a5b-9e68-c7ab9a523a8f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-01T10:15:49Z&ske=2026-08-02T10:15:49Z&sks=b&skv=2026-02-06&sig=%2BlR3S6ItIKXNVKrWpwkACcTDLkZKnHVs7YuSMxwNc5o%3D"
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$PACKAGE_URL" -o package.zip
          unzip -q package.zip -d package
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          package = Path('package')
          report = json.loads((package / 'report.json').read_text(encoding='utf-8'))
          if report.get('mapping_count') != 36:
              raise SystemExit(f"Unexpected mapping count: {report.get('mapping_count')}")
          if report.get('added_webp_count') != 37:
              raise SystemExit(f"Unexpected WebP count: {report.get('added_webp_count')}")
          delete_paths = report.get('delete_paths', [])
          if len(delete_paths) != 73:
              raise SystemExit(f'Unexpected delete count: {len(delete_paths)}')

          for raw in delete_paths:
              path = Path(raw)
              if not path.exists():
                  raise SystemExit(f'Expected existing file before replacement: {raw}')
              path.unlink()

          changes = package / 'changes'
          copied = 0
          for source in changes.rglob('*.webp'):
              destination = Path('.') / source.relative_to(changes)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
              copied += 1
          if copied != 37:
              raise SystemExit(f'Expected to copy 37 WebPs, copied {copied}')

          folder = Path('img/HOLOLIVE')
          files = sorted(path for path in folder.iterdir() if path.is_file())
          if len(files) != 37:
              raise SystemExit(f'Expected 37 final files, found {len(files)}')
          non_webp = [path.as_posix() for path in files if path.suffix.lower() != '.webp']
          if non_webp:
              raise SystemExit(f'Non-WebP files remain: {non_webp}')
          missing = [mapping['new'] for mapping in report['mappings'] if not Path(mapping['new']).exists()]
          if missing:
              raise SystemExit(f'Missing mapped WebPs: {missing}')
          residual = [raw for raw in delete_paths if Path(raw).exists()]
          if residual:
              raise SystemExit(f'Residual old files: {residual}')
          names_with_spaces = [path.name for path in files if ' ' in path.name]
          if names_with_spaces:
              raise SystemExit(f'Non-normalized filenames remain: {names_with_spaces}')
          print(f'Validated {len(files)} final HOLOLIVE WebP files and {len(report["mappings"])} mappings')
          PY
          rm -rf package package.zip
          git rm .github/workflows/apply-hololive-webp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace HOLOLIVE images with named WebP assets"
          git push origin HEAD:agent/apply-hololive-webp-20260801
