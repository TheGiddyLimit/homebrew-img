name: Export image manifest temporary

on:
  pull_request:
    branches:
      - update/renaming-images-2026
    paths:
      - .github/migration-export-trigger
      - .github/workflows/export-manifest-temp.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build image inventory
        run: |
          find img -type f -printf '%P\t%s\n' | sort > homebrew-img-manifest.tsv
          find img -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort > homebrew-img-folders.txt
      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-img-inventory
          path: |
            homebrew-img-manifest.tsv
            homebrew-img-folders.txt
          retention-days: 1
          if-no-files-found: error
